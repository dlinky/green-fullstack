<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>라이프 대시보드</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="js/app.js" defer></script>
</head>
<body>
	<container>
		<header>
			<h2 class="title">라이프 대시보드</h2>
			<p class="date">2026-11-19 목요일</p>
		</header>
		<main>
			<section class="todo-box">
				<h3 class="todo-title">오늘의 할 일 목록</h3>
				<div class="todo-list">
				</div>
				<div class="add-todo">
					<button class="add-btn">할 일 추가하기</button>
					<input name="task-name" class="task-name" hidden>
					<button class="confirm-btn" hidden>추가</button>
					<button class="cancel-btn" hidden>취소</button>					
				</div>
				<div class="progress">
					<div class="progress-bar"></div>					
					<span class="progress-text">오늘의 할 일 완료율 : <span class="progress-rate"></span>%</span>					
				</div>
				
			</section>
			<section class="memo-box">
				<h3 class="memo-title">메모</h3>
				<textarea class="memo" name="memo" placeholder=""></textarea>
				<div class="memo-btns">
					<button id="save-memo">저장</button>
					<button id="clear-memo">지우기</button>	
				</div>
			</section>
		</main>
	</container>
</body>
</html>
